<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eeeae5"><title>Xarts Office — Promoted</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%231b4a6b%27/%3E%3Ctext x=%278%27 y=%2724%27 font-size=%2728%27 fill=%27white%27%3Ep%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/decision-desk.css"><script type="module" src="/app.js"></script></head>
<body data-mode="live">
<a class="service-activity-link" href="/activity">Service activity ↗</a>
<button id="office-menu" class="office-menu" aria-expanded="false" aria-controls="office-navigation">p↗ <span>Office menu</span></button>

<div class="office-caption"><span class="caption-mark">↗</span><p>Step into the work.<small>Click an object to open its desk.</small></p></div>
